<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111F">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timers">
<meta name="description" content="Playful visual timers and a sleep trainer for kids. Works offline and installs full screen.">
<title>Visual Timers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css?v=c5c22e0900">
<link rel="stylesheet" href="themes.css?v=c5c22e0900">
<link rel="stylesheet" href="app.css?v=c5c22e0900">
</head>
<body>
<main id="home" class="home">
<header class="home-head">
<h1>Visual timers</h1>
<p>Pick a timer, set the minutes, press play.</p>
</header>
<section id="grid" class="grid" aria-label="Timers"></section>
<section class="settings" aria-label="Settings">
<label class="toggle"><input type="checkbox" id="opt-sound"><span>Chime when time is up</span></label>
<label class="toggle"><input type="checkbox" id="opt-demo"><span>Demo speed: 1 minute takes 1 second</span></label>
<button type="button" id="install" class="install" hidden>Install the app</button>
<p id="ios-hint" class="hint" hidden>To install on iPhone or iPad: tap Share, then “Add to Home Screen”.</p>
<p class="hint">The screen stays awake while a timer is open.</p>
</section>
</main>
<div id="player" class="player" hidden>
<div id="stage" class="dc-stage"></div>
</div>
<script type="module" src="app.js?v=c5c22e0900"></script>
</body>
</html>
